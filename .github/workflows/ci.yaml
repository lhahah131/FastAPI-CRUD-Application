name: FastAPI DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master", "latihan" ]
  pull_request:
    branches: [ "main", "master", "latihan" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ========================================================
  # JOB 1: Test & Code Quality
  # ========================================================
  test:
    name: Run Automated Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          pytest test.py -v

  # ========================================================
  # JOB 2: Security Scans (Secrets & Dependencies)
  # ========================================================
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Secrets Leak (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0" # Ubah ke 1 jika ingin otomatis menggagalkan pipeline saat ada CVE

  # ========================================================
  # JOB 3: Docker Build, SARIF Scan & SBOM Generation
  # ========================================================
  docker-build-scan:
    name: Docker Build, Security Scan & SBOM
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Production Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          load: true
          tags: fastapi-app:ci-test

      - name: Scan Docker Image (Trivy SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "fastapi-app:ci-test"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Scan to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: "fastapi-app:ci-test"
          format: "cyclonedx-json"
          output-file: "sbom-ci.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-ci.json
