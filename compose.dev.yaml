services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
    environment:
      - DEBUG=true
      - APP_ENV=development
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./requirements-dev.txt
    build:
      target: development

  nginx:
    ports: !override
      - "8080:80"

  adminer:
    image: adminer
    profiles:
      - debug 
    ports:
      - "8001:8080"
    networks:
      - backend
    depends_on:
      - db
