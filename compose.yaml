services:
  api:
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    build:
      context: .    
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_NAME=${APP_NAME:-FastAPI-CRUD-Application}
      - POSTGRES_USER=${POSTGRES_USER:-Composer}
      - POSTGRES_DB=${POSTGRES_DB:-latihan}
      - POSTGRES_HOST=db
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - PYTHONDONTWRITEBYTECODE=1
    secrets:
      - db_password
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
    mem_limit: 512m
    cpus: "0.50"

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-9000}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - frontend
    mem_limit: 128m
    cpus: "0.25"

  db:
    image: postgres:15-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Composer} -d ${POSTGRES_DB:-latihan}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-Composer}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${POSTGRES_DB:-latihan}
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    mem_limit: 768m
    cpus: "1.00"
  adminer:
    image: adminer
    profiles:
      - debug
    ports:
      - "8001:8080"
    networks:
      - backend
    depends_on:
      - db

secrets:
  db_password:
    file: ./db_password.txt

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:

